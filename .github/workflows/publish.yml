name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-dsh-agent-observe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Check publishing toolchain
        run: |
          node --version
          npm --version

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag v$tag_version does not match package.json version $package_version" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Test package
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Publish package
        run: npm publish --access public --provenance
