name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-agent-observe
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-plugin-evaluation-portable-runner
          path: dsh-plugin-evaluation-portable-runner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --legacy-peer-deps
        working-directory: dsh-agent-observe
      - run: npm test
        working-directory: dsh-agent-observe
      - run: npm pack --dry-run --json
        working-directory: dsh-agent-observe

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-agent-observe
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-plugin-evaluation-portable-runner
          path: dsh-plugin-evaluation-portable-runner
      - uses: actions/checkout@v4
        with:
          repository: dsh-plugin-evaluation/dsh-plugin-evaluation-standards
          path: dsh-plugin-evaluation-standards
      - run: touch .env
        working-directory: dsh-agent-observe
      - run: docker compose config --quiet
        working-directory: dsh-agent-observe
